<!DOCTYPE html>

<style>
:root {
  --primary: #1e40af;
  --primary-light: #3b82f6;
  --accent: #059669;
  --bg: #f8fafc;
  --card-bg: #fff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.header {
  background: linear-gradient(135deg, #1e3a5f 0%, #1e40af 50%, #3b82f6 100%);
  color: #fff;
  padding: 48px 24px;
  text-align: center;
}
.header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.header p { font-size: 15px; opacity: 0.85; }
.header .badge {
  display: inline-block;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px;
  padding: 4px 16px;
  font-size: 13px;
  margin-top: 12px;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 32px 24px;
}
.section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--primary);
  display: inline-block;
}
.current-card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  border: 1px solid var(--border);
  margin-bottom: 32px;
  position: relative;
  overflow: hidden;
}
.current-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
}
.current-card .label {
  display: inline-block;
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 6px;
  margin-bottom: 12px;
}
.current-card h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}
.current-card .meta {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  text-decoration: none;
  padding: 12px 28px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(30,64,175,0.25);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(30,64,175,0.35);
}
.history-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.history-item {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 16px 20px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.2s;
  text-decoration: none;
  color: var(--text);
}
.history-item:hover {
  border-color: var(--primary-light);
  box-shadow: 0 2px 12px rgba(30,64,175,0.08);
  transform: translateX(4px);
}
.history-item .left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.history-item .date-badge {
  background: #f1f5f9;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  white-space: nowrap;
}
.history-item .title {
  font-size: 15px;
  font-weight: 600;
}
.history-item .arrow {
  color: var(--text-secondary);
  font-size: 18px;
}
.footer {
  text-align: center;
  padding: 32px;
  color: var(--text-secondary);
  font-size: 13px;
}
</style>
</head>
<body>
