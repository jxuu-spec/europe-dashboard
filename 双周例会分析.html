<style>
:root {

  --surface: #FFFFFF;

  --accent-light: #0086F6;
  --accent-pale: #E6F0FA;

}
* { margin:0; padding:0; box-sizing:border-box; }
body {

.badge {

  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  margin-bottom: 24px;
}
.badge::before {
  content: '';
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
}
h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.02em; }
.period {

  font-weight: 700;

}

  margin-bottom: 32px;
}
.btn {

  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));

  font-size: 16px;
  font-weight: 700;
  padding: 16px 32px;
  border-radius: 12px;
  text-decoration: none;
  box-shadow: 0 4px 12px rgba(0,102,204,0.25);
  transition: transform .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,102,204,0.35); }
.meta {
  margin-top: 32px;
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--text-dim);
}
.meta span { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.blue { background: var(--accent); }
.dot.orange { background: var(--orange); }
